name: Build & Release Android TV & Mobile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Build Android TV APK
        working-directory: tv/android
        run: gradle assembleRelease

      - name: Rename Android TV APK
        run: |
          mkdir -p dist-apks
          cp tv/android/app/build/outputs/apk/release/*.apk dist-apks/gametranslator-tv.apk

      - name: Publish Android TV APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android TV & Mobile (Subtitle Studio UI)
          files: dist-apks/gametranslator-tv.apk
