name: Build & Release Android TV & Mobile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build Android TV APK
        working-directory: tv/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Mobile Android APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android TV & Mobile (Subtitle Studio UI)
          files: |
            tv/android/app/build/outputs/apk/release/*.apk
            mobile/build/app/outputs/flutter-apk/app-release.apk
