name: Build & Release Android TV & Mobile
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native & Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libpsl-dev ninja-build cmake pkg-config python3-pip
          pip3 install --break-system-packages protobuf grpcio-tools

      - name: Fetch chiaki-ng dependency if missing
        run: |
          if [ ! -d "third-party/chiaki-ng/.git" ] && [ ! -f "third-party/chiaki-ng/CMakeLists.txt" ]; then
            mkdir -p third-party
            git clone --depth 1 --recurse-submodules https://github.com/streetpea/chiaki-ng.git third-party/chiaki-ng
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Decode signing keystore & set versionCode
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > /tmp/release-keystore.jks
            echo "ANDROID_KEYSTORE_FILE=/tmp/release-keystore.jks" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi
          echo "TV_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> $GITHUB_ENV

      - name: Build Android TV APK
        working-directory: tv/android
        run: gradle assembleRelease

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Mobile Android APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: Prepare distinct release APKs
        run: |
          mkdir -p dist-apks
          TV_APK=$(find tv/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          MOBILE_APK="mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$TV_APK"
          test -f "$MOBILE_APK"
          cp "$TV_APK" dist-apks/gametranslator-tv.apk
          cp "$MOBILE_APK" dist-apks/gametranslator-mobile.apk
          ls -lh dist-apks/

      - name: Clean up signing keystore
        if: always()
        run: rm -f /tmp/release-keystore.jks

      - name: Publish APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android TV & Mobile (Subtitle Studio UI)
          files: |
            dist-apks/gametranslator-tv.apk
            dist-apks/gametranslator-mobile.apk
