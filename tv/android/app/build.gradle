plugins { id 'com.android.application' }

android {
    namespace 'com.gametranslator.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gametranslator.tv'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(((System.getenv('TV_VERSION_CODE') ?: '100').trim() ?: '100'))
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def store = System.getenv('ANDROID_KEYSTORE_FILE')
            if (store) {
                storeFile file(store)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'gametranslator'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ANDROID_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('generated/tv-assets')
}

tasks.register('copyTvAssets', Copy) {
    into layout.buildDirectory.dir('generated/tv-assets')
    from('../../webos') {
        include 'app.js', 'i18n.js', 'config.js', 'index.html', 'style.css', 'icon.png', 'largeIcon.png'
        into('tv')
    }
    from('../../webos/fonts') {
        include '*.ttf'
        into('tv/fonts')
    }
    from('..') {
        include 'platform.js'
        into('tv')
    }
}
preBuild.dependsOn 'copyTvAssets'
